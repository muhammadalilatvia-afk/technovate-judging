<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizer – Ajou Technovate Hackathon 3.0</title>
<link rel="icon" href="assets/technovate-mark.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .tabs button { border: 1px solid var(--line); background: rgba(255,255,255,.05); padding: 9px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; }
  .tabs button.on { background: var(--orange); color: #1a1205; border-color: var(--orange); }
  .lineup { max-height: 520px; overflow: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 9px 14px; cursor: pointer; font-weight: 700; }
  .seg button.on { background: var(--orange); color: #1a1205; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; }
  @media print { .topbar, .tabs, .noprint { display: none !important; } body { background: #fff; color: #000; } .card { border: 0; background: #fff; } th, td { border-color: #ccc; color: #000; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><img src="assets/technovate-mark.svg" alt="" width="40" height="40">
    <span><b>AJOU TECHNOVATE</b><small>HACKATHON 3.0 · ORGANIZER</small></span></a>
  <span class="spacer"></span>
  <span id="mode"></span>
  <a class="btn" href="live.html" target="_blank">Open live screen ↗</a>
  <button class="btn hidden" id="logout">Log out</button>
</header>
<main class="wrap" id="app"></main>

<script type="module">
import { getApi, esc, fmt, rank, toast, modeBadge, teamsFromCsv, toCsv, download, fmtSize, fmtTime, avatar } from "./js/common.js";
const api = await getApi();
document.getElementById("mode").innerHTML = modeBadge(api);
const app = document.getElementById("app");
const [rounds, criteria] = await Promise.all([api.getRounds(), api.getCriteria()]);
const maxTotal = criteria.reduce((a, c) => a + c.max_points, 0);
let pin = sessionStorage.getItem("adminPin");
let tab = sessionStorage.getItem("adminTab") || "dashboard";
let resultsRound = null;

const run = async (fn, okMsg) => { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, "err"); throw e; } };

// ------------------------------------------------------------------ login --
async function loginView(msg = "") {
  document.getElementById("logout").classList.add("hidden");
  const status = await api.adminStatus();
  const setup = !status.configured;
  app.innerHTML = `<div class="card" style="max-width:460px;margin:60px auto">
    <h2>${setup ? "First-time setup" : "Organizer login"}</h2>
    <p class="muted">${setup ? "Choose the organizer PIN. Keep it secret — it controls the whole event." : "Enter the organizer PIN."}</p>
    ${api.mode === "demo" ? `<p class="small"><span class="badge demo">DEMO</span> Organizer PIN: 0000</p>` : ""}
    <form id="f" class="stack"><label class="field"><span>${setup ? "New organizer PIN (min. 4 characters)" : "Organizer PIN"}</span>
      <input type="password" id="pin" autocomplete="off" autofocus required minlength="4"></label>
      ${msg ? `<div class="toast err" style="position:static">${esc(msg)}</div>` : ""}
      <button class="btn primary big" style="width:100%;justify-content:center">${setup ? "Save PIN" : "Log in"}</button></form></div>`;
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const p = document.getElementById("pin").value.trim();
    try {
      if (setup) await api.adminSetup(p);
      if (!(await api.adminCheck(p))) return loginView("Wrong PIN");
      pin = p; sessionStorage.setItem("adminPin", p); start();
    } catch (err) { loginView(err.message); }
  };
}

// ------------------------------------------------------------------- data --
async function load() {
  const st = await api.getState();
  const [teams, boards, judges] = await Promise.all([
    api.getTeams(),
    Promise.all(rounds.map((r) => api.getLeaderboard(r.id))),
    api.adminListJudges(pin),
  ]);
  const [progress, pres, activity, rstatus] = await Promise.all([api.getJudgeProgress(), api.adminPresentations(pin), api.adminActivity(pin, 30), api.getRoundStatus()]);
  return { st, teams, boards: Object.fromEntries(rounds.map((r, i) => [r.id, boards[i]])), judges, progress, pres, activity, rstatus };
}

// -------------------------------------------------------------- rendering --
async function render() {
  const D = await load();
  const up = D.pres.filter((p) => p.file_name).length;
  const tabs = [["dashboard", "Dashboard"], ["control", "Event control"], ["presentations", `Presentations (${up}/${D.pres.length})`], ["teams", `Teams (${D.teams.length})`], ["rounds", "Rounds & line-ups"], ["judges", `Judges (${D.judges.filter((j) => j.active).length})`], ["results", "Results & export"]];
  app.innerHTML = `<div class="tabs noprint">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div><div id="pane"></div>`;
  app.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; sessionStorage.setItem("adminTab", tab); render(); });
  const pane = document.getElementById("pane");
  ({ dashboard, control, presentations: presentationsPane, teams: teamsPane, rounds: roundsPane, judges: judgesPane, results })[tab](pane, D);
}

// --------------------------------------------------------- round banner --
function advanceBanner({ st, boards, rstatus }) {
  const cur = (rstatus || []).find((r) => r.round_id === st.active_round);
  if (!cur) return "";
  const round = rounds.find((r) => r.id === st.active_round);
  if (!cur.complete) {
    return cur.teams ? `<div class="card" style="margin-bottom:16px;padding:12px 18px"><b>${esc(round.name)} progress:</b> ${cur.scored_all} of ${cur.teams} teams scored by all judges.
      ${round.id < 3 ? `When all are scored, the top ${round.qualify_top} move to ${esc(rounds[round.id].name)} automatically.` : ""}</div>` : "";
  }
  if (round.id < 3) {
    const next = rounds[round.id], n = boards[next.id].length;
    return `<div class="card" style="margin-bottom:16px;border-color:var(--green);background:rgba(34,197,94,.12)">
      <h2 style="margin:0 0 6px">✅ ${esc(round.name)} complete — ${n} teams are now in ${esc(next.name)}</h2>
      <p class="muted small" style="margin:0 0 10px">The top ${round.qualify_top}${round.id === 1 ? " plus the teams that skip Round 1" : ""} were moved automatically. Announce the results, then start the next round.</p>
      <button class="btn green big" data-start="${next.id}">▶ Start ${esc(next.name)}</button>
      <button class="btn" data-view-now="podium">🏆 Show ${esc(round.name)} top 3 on screen</button></div>`;
  }
  return `<div class="card" style="margin-bottom:16px;border-color:#fbbf24;background:rgba(251,191,36,.12)">
    <h2 style="margin:0 0 10px">🏆 Final complete — the winners are decided</h2>
    <button class="btn primary big" data-view-now="podium">Show winners on the big screen</button></div>`;
}
function wireBanner(pane, st) {
  pane.querySelectorAll("[data-start]").forEach((b) => b.onclick = async () => {
    const id = Number(b.dataset.start);
    await run(() => api.adminSetState(pin, { active_round: id, current_team_id: null, scoring_open: false, view: "welcome" }), `${rounds[id - 1].name} started`);
    render();
  });
  pane.querySelectorAll("[data-view-now]").forEach((b) => b.onclick = async () => {
    await run(() => api.adminSetState(pin, { view: b.dataset.viewNow }), "Live screen updated"); render();
  });
}

// ---------------------------------------------------------- event control --
function control(pane, D) {
  const { st, boards, progress, pres } = D;
  const slides = Object.fromEntries(pres.filter((p) => p.file_path).map((p) => [p.team_id, p]));
  const round = rounds.find((r) => r.id === st.active_round);
  const lineup = [...boards[round.id]].sort((a, b) => a.position - b.position);
  const curIdx = lineup.findIndex((t) => t.team_id === st.current_team_id);
  const allDone = progress.length && progress.every((j) => j.scored_current);
  pane.innerHTML = advanceBanner(D) + `<div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
    <section class="card">
      <h2>Team on stage</h2>
      <div class="row" style="margin-bottom:12px">
        <div class="seg">${rounds.map((r) => `<button data-round="${r.id}" class="${r.id === st.active_round ? "on" : ""}">${esc(r.name)}</button>`).join("")}</div>
        <span class="spacer" style="flex:1"></span>
        <button class="btn" id="prev" ${curIdx <= 0 ? "disabled" : ""}>◀ Previous</button>
        <button class="btn primary" id="next" ${curIdx >= lineup.length - 1 ? "disabled" : ""}>Next team ▶</button>
      </div>
      ${lineup.length ? "" : `<p class="muted">No teams in ${esc(round.name)} yet. Build the line-up in <b>Rounds &amp; line-ups</b>.</p>`}
      <div class="lineup"><table><thead><tr><th>#</th><th>Team</th><th>Project</th><th class="num">Judges</th><th class="num">Score</th><th></th></tr></thead><tbody>
      ${lineup.map((t, i) => `<tr class="${t.team_id === st.current_team_id ? "current" : ""}">
        <td>${i + 1}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(api, t, 38)}<b>${esc(t.code)}</b></div></td><td>${esc(t.project)}<div class="muted small">${esc(t.members)}</div>
        ${slides[t.team_id] ? `<a class="small" href="${esc(api.fileUrl(slides[t.team_id].file_path))}" target="_blank" rel="noopener">📎 ${esc(slides[t.team_id].file_name)}</a>` : `<span class="small" style="color:#fca5a5">No slides uploaded</span>`}</td>
        <td class="num">${t.judges}/${progress.length}</td><td class="num">${t.judges ? fmt(t.score) : "–"}</td>
        <td>${t.team_id === st.current_team_id ? `<span class="badge orange">ON STAGE</span>` : `<button class="btn" data-stage="${t.team_id}">Put on stage</button>`}</td></tr>`).join("")}
      </tbody></table></div>
    </section>
    <section class="stack">
      <div class="card">
        <h2>Scoring</h2>
        <div class="switch"><div><b>Judges can score</b><div class="muted small">Open after a team finishes presenting (the screen switches from the team intro to the live board).</div></div>
          <button class="btn ${st.scoring_open ? "green" : ""}" id="scoring">${st.scoring_open ? "OPEN — click to close" : "CLOSED — click to open"}</button></div>
        <div class="switch"><div><b>Scores visible on live screen</b><div class="muted small">Hide to keep results secret until the announcement.</div></div>
          <button class="btn ${st.show_scores ? "green" : ""}" id="show">${st.show_scores ? "VISIBLE" : "HIDDEN"}</button></div>
        <div class="switch"><div><b>Live screen view</b></div>
          <div class="seg">${[["welcome", "Welcome"], ["intro", "Team intro"], ["board", "Live board"], ["podium", "Winners"]].map(([k, l]) => `<button data-view="${k}" class="${st.view === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
        <label class="field" style="margin-top:10px"><span>Announcement on the screen's bottom bar (empty = show next team)</span>
          <div class="row"><input type="text" id="msg" value="${esc(st.message)}" style="flex:1"><button class="btn" id="msgbtn">Show</button></div></label>
      </div>
      <div class="card">
        <h2>Judges on current team ${allDone ? `<span class="badge ok">ALL SCORED</span>` : ""}</h2>
        <div class="grid cols-2">${progress.map((j) => `<div class="judge-chip ${j.scored_current ? "done" : ""}"><b>${esc(j.name)}</b>
          <span>${j.scored_current ? "✓ scored" : "not yet"} · ${j.scored} in round</span></div>`).join("") || `<p class="muted">No judges yet — add them in the Judges tab.</p>`}</div>
      </div>
    </section></div>`;

  wireBanner(pane, st);
  const set = (patch, msg) => run(() => api.adminSetState(pin, patch), msg).then(render);
  pane.querySelectorAll("[data-round]").forEach((b) => b.onclick = () => set({ active_round: Number(b.dataset.round), current_team_id: null, scoring_open: false }, "Round changed"));
  pane.querySelectorAll("[data-stage]").forEach((b) => b.onclick = () => set({ current_team_id: Number(b.dataset.stage), scoring_open: false, view: "intro" }));
  pane.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => set({ view: b.dataset.view }));
  const go = (i) => lineup[i] && set({ current_team_id: lineup[i].team_id, scoring_open: false, view: "intro" });
  document.getElementById("prev").onclick = () => go(curIdx - 1);
  document.getElementById("next").onclick = () => go(curIdx + 1);
  document.getElementById("scoring").onclick = () => set(st.scoring_open ? { scoring_open: false } : { scoring_open: true, view: "board" });
  document.getElementById("show").onclick = () => set({ show_scores: !st.show_scores });
  document.getElementById("msgbtn").onclick = () => set({ message: document.getElementById("msg").value.trim() }, "Announcement updated");
}

// -------------------------------------------------------------- dashboard --
function dashboard(pane, D) {
  const { st, teams, boards, judges, progress, pres, activity } = D;
  const round = rounds.find((r) => r.id === st.active_round);
  const activeJudges = judges.filter((j) => j.active).length;
  const students = teams.reduce((a, t) => a + (t.members ? t.members.split(";").filter((x) => x.trim()).length : 0), 0);
  const uploaded = pres.filter((p) => p.file_name);
  const cur = boards[round.id].find((t) => t.team_id === st.current_team_id);
  const stat = (label, value, sub = "") => `<div class="card"><div class="muted small">${label}</div><div style="font-size:34px;font-weight:900">${value}</div><div class="muted small">${sub}</div></div>`;
  const bar = (n, d) => `<div style="height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden"><div style="height:100%;width:${d ? Math.round(n / d * 100) : 0}%;background:linear-gradient(90deg,var(--orange),var(--orange-2))"></div></div>`;
  const roundRows = rounds.map((r) => {
    const b = boards[r.id], full = b.filter((t) => activeJudges && t.judges >= activeJudges).length, any = b.filter((t) => t.judges).length;
    const top = rank(b).filter((x) => x.judges)[0];
    return `<tr><td><b>${esc(r.name)}</b>${r.id === st.active_round ? ' <span class="badge orange">ACTIVE</span>' : ""}</td><td>${b.length}</td>
      <td style="min-width:160px">${bar(full, b.length)}<div class="muted small">${full} fully scored · ${any} started</div></td>
      <td>${top ? `${esc(top.code)} · ${fmt(top.score)}` : "–"}</td></tr>`;
  }).join("");
  const missing = pres.filter((p) => !p.file_name);
  pane.innerHTML = advanceBanner(D) + `
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">
      ${stat("Teams", teams.length, `${teams.filter((t) => t.round1).length} in Round 1 · ${teams.filter((t) => !t.round1).length} from Round 2`)}
      ${stat("Students", students, "registered participants")}
      ${stat("Presentations", `${uploaded.length}<span class="muted" style="font-size:20px">/${pres.length}</span>`, `${pres.length ? Math.round(uploaded.length / pres.length * 100) : 0}% uploaded`)}
      ${stat("Team photos", `${teams.filter((t) => t.photo_path).length}<span class="muted" style="font-size:20px">/${teams.length}</span>`, "shown on the big screen")}
      ${stat("Judges", activeJudges, `${progress.filter((j) => j.scored_current).length} scored the team on stage`)}
      ${stat("Now", esc(round.name), cur ? `On stage: ${esc(cur.code)} · scoring ${st.scoring_open ? "open" : "closed"}` : "No team on stage")}
    </div>
    <div class="grid cols-2" style="margin-top:18px">
      <section class="card"><h2>Rounds</h2>
        <table><thead><tr><th>Round</th><th>Teams</th><th>Progress</th><th>Leader</th></tr></thead><tbody>${roundRows}</tbody></table>
        <h2 style="margin-top:18px">Judges · ${esc(round.name)}</h2>
        <table><thead><tr><th>Judge</th><th>Scored</th><th>Progress</th></tr></thead><tbody>
        ${progress.map((j) => `<tr><td>${esc(j.name)} ${j.scored_current ? "✅" : ""}</td><td>${j.scored}/${boards[round.id].length}</td><td style="min-width:140px">${bar(j.scored, boards[round.id].length)}</td></tr>`).join("") || `<tr><td colspan="3" class="muted">No judges yet</td></tr>`}
        </tbody></table>
        <div class="row" style="margin-top:14px"><span class="badge ${st.uploads_open ? "ok" : "off"}">UPLOADS ${st.uploads_open ? "OPEN" : "CLOSED"}</span>
          <button class="btn" id="tglUploads">${st.uploads_open ? "Close uploads" : "Re-open uploads"}</button>
          <a class="btn" href="upload.html" target="_blank">Upload page ↗</a></div>
      </section>
      <section class="card"><h2>Recent activity</h2>
        <div style="max-height:430px;overflow:auto">${activity.map((a) => `<div style="padding:7px 0;border-bottom:1px solid var(--line)">
          <span class="badge ${a.kind === "score" ? "orange" : "ok"}">${a.kind === "upload" ? "UPLOAD" : a.kind === "photo" ? "PHOTO" : "SCORE"}</span>
          <span class="muted small">${fmtTime(a.at)}</span><div class="small">${esc(a.detail)}</div></div>`).join("") || `<p class="muted">Nothing yet. Uploads and scores appear here live.</p>`}</div>
      </section>
    </div>
    <section class="card" style="margin-top:18px"><h2>Missing presentations <span class="badge">${missing.length}</span></h2>
      <div class="pill-list">${missing.map((p) => `<button title="${esc(p.project)}">${esc(p.code)}</button>`).join("") || `<span class="muted">All teams have uploaded 🎉</span>`}</div>
    </section>`;
  wireBanner(pane, st);
  document.getElementById("tglUploads").onclick = () => run(() => api.adminSetState(pin, { uploads_open: !st.uploads_open }), "Saved").then(render);
}

// ---------------------------------------------------------- presentations --
function presentationsPane(pane, { pres }) {
  const done = pres.filter((p) => p.file_name).length, photos = pres.filter((p) => p.photo_path).length;
  pane.innerHTML = `<section class="card">
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0">Presentations · ${done}/${pres.length} uploaded · 📸 ${photos}/${pres.length} photos</h2><span style="flex:1"></span>
      <button class="btn" id="codes">⬇ Team upload codes (CSV)</button><button class="btn" id="links">⬇ File links (CSV)</button>
      <button class="btn" id="showkeys">Show upload codes</button></div>
    <p class="muted small">Send each team leader their team code and 6-digit upload code (for example in Telegram). Students upload on the <a href="upload.html" target="_blank">upload page</a>.
      Files are stored in Supabase Storage; links are long and unguessable.</p>
    <table><thead><tr><th>Photo</th><th>Team</th><th>Project</th><th>Upload code</th><th>File</th><th>Size</th><th>Uploaded</th></tr></thead><tbody>
    ${pres.map((p) => `<tr><td>${p.photo_path ? `<a href="${esc(api.photoUrl(p.photo_path))}" target="_blank" rel="noopener">${avatar(api, p, 52, "sq")}</a><div><button class="btn danger small" data-clearphoto="${p.team_id}" style="padding:2px 8px;margin-top:4px">Remove</button></div>` : `<span class="muted small">No photo</span>`}</td><td><b>${esc(p.code)}</b></td><td>${esc(p.project)}<div class="muted small">${esc(p.members)}</div></td>
      <td><code class="key" data-key="${esc(p.upload_key)}">••••••</code></td>
      <td>${p.file_name ? `<a href="${esc(api.fileUrl(p.file_path))}" target="_blank" rel="noopener">📎 ${esc(p.file_name)}</a>${p.uploads > 1 ? ` <span class="muted small">v${p.uploads}</span>` : ""}` : `<span style="color:#fca5a5">Not uploaded</span>`}</td>
      <td class="small">${p.file_size ? fmtSize(p.file_size) : ""}</td><td class="small">${fmtTime(p.uploaded_at)}</td></tr>`).join("")}
    </tbody></table></section>`;
  document.getElementById("showkeys").onclick = (e) => {
    const show = e.target.textContent.startsWith("Show");
    pane.querySelectorAll(".key").forEach((k) => { k.textContent = show ? k.dataset.key : "••••••"; });
    e.target.textContent = show ? "Hide upload codes" : "Show upload codes";
  };
  pane.querySelectorAll("[data-clearphoto]").forEach((b) => b.onclick = async () => {
    if (!confirm("Remove this team photo? The team can upload a new one.")) return;
    await run(() => api.adminClearPhoto(pin, Number(b.dataset.clearphoto)), "Photo removed"); render();
  });
  document.getElementById("codes").onclick = () => download("team-upload-codes.csv", toCsv([["team_code", "project", "members", "upload_code", "upload_page"],
    ...pres.map((p) => [p.code, p.project, p.members, p.upload_key, new URL("upload.html", location.href).href])]));
  document.getElementById("links").onclick = () => download("presentation-links.csv", toCsv([["team_code", "project", "file_name", "url", "uploaded_at"],
    ...pres.filter((p) => p.file_path).map((p) => [p.code, p.project, p.file_name, api.fileUrl(p.file_path), p.uploaded_at])]));
}

// ------------------------------------------------------------------ teams --
function teamsPane(pane, { teams, st, boards }) {
  const round = rounds.find((r) => r.id === st.active_round);
  const maxNum = Math.max(0, ...teams.map((t) => Number((t.code.match(/\d+/) || [0])[0])));
  const nextCode = "T" + String(maxNum + 1).padStart(2, "0");
  pane.innerHTML = `<div class="grid cols-2">
    <section class="card stack">
      <h2>Import teams from CSV</h2>
      <p class="muted small">Upload the Google Form responses (File → Download → CSV) or a CSV with columns
        <code>code, project, members, department, round1</code>. Phone numbers, e-mails, Telegram and student IDs are ignored.
        Duplicate submissions by the same team leader are merged (latest wins). Round 1 = IT Business, not 1st/2nd/4th year.</p>
      <input type="file" id="file" accept=".csv,text/csv">
      <label class="row small"><input type="checkbox" id="replace"> Replace all existing teams (deletes their scores)</label>
      <div id="preview" class="muted small"></div>
      <div class="row"><button class="btn primary" id="import" disabled>Import</button>
        <button class="btn" id="tpl">Download CSV template</button></div>
    </section>
    <section class="card stack">
      <h2>➕ Add a new team (late registration)</h2>
      <div class="grid cols-2"><label class="field"><span>Team code</span><input type="text" id="n_code" value="${esc(nextCode)}"></label>
        <label class="field"><span>Department</span><input type="text" id="n_dept" placeholder="IT Business"></label></div>
      <label class="field"><span>Project name</span><input type="text" id="n_proj"></label>
      <label class="field"><span>Members (separate with ;)</span><input type="text" id="n_mem" placeholder="Name One; Name Two; Name Three"></label>
      <label class="row small"><input type="checkbox" id="n_r1" checked> Competes in Round 1 (IT Business 3rd year)</label>
      <label class="row small"><input type="checkbox" id="n_lineup" checked> Also add to the ${esc(round.name)} line-up now (at the end)</label>
      <button class="btn primary" id="add">Add team</button>
      <p class="muted small">To add a participant to an existing team, click <b>✎ Edit</b> on that team below.</p>
    </section></div>
    <section class="card" style="margin-top:18px"><h2>All teams</h2>
      <table><thead><tr><th>Code</th><th>Project</th><th>Members</th><th>Department</th><th>Round 1</th><th></th></tr></thead><tbody>
      ${teams.map((t) => `<tr data-row="${t.id}"><td><b>${esc(t.code)}</b></td><td>${esc(t.project)}</td><td class="small">${esc(t.members)}</td><td class="small">${esc(t.department)}</td>
        <td><input type="checkbox" data-r1="${t.id}" ${t.round1 ? "checked" : ""}></td>
        <td style="white-space:nowrap"><button class="btn" data-edit="${t.id}">✎ Edit</button> <button class="btn danger" data-del="${t.id}" title="Delete">✕</button></td></tr>`).join("")}
      </tbody></table></section>`;
  let rows = null;
  document.getElementById("file").onchange = async (e) => {
    try {
      rows = teamsFromCsv(await e.target.files[0].text());
      document.getElementById("preview").innerHTML = `Found <b>${rows.length}</b> teams · ${rows.filter((r) => r.round1).length} in Round 1 · ${rows.filter((r) => !r.round1).length} join from Round 2`;
      document.getElementById("import").disabled = false;
    } catch (err) { toast(err.message, "err"); }
  };
  document.getElementById("import").onclick = async () => {
    const replace = document.getElementById("replace").checked;
    if (replace && !confirm("Replace ALL teams? Existing scores for those teams will be deleted.")) return;
    await run(() => api.adminImportTeams(pin, rows, replace), `Imported ${rows.length} teams`); render();
  };
  document.getElementById("tpl").onclick = () => download("teams-template.csv", toCsv([["code", "project", "members", "department", "round1"], ["T01", "Example project", "Name One; Name Two", "IT Business", "yes"]]));
  document.getElementById("add").onclick = async () => {
    const v = (id) => document.getElementById(id).value.trim();
    const code = v("n_code").toUpperCase();
    if (!code || !v("n_proj")) return toast("Team code and project name are required", "err");
    if (teams.some((t) => t.code.toUpperCase() === code)) return toast(`Team code ${code} already exists`, "err");
    await run(() => api.adminImportTeams(pin, [{ code, project: v("n_proj"), members: v("n_mem").split(/[;,]/).map((x) => x.trim()).filter(Boolean).join("; "),
      department: v("n_dept"), round1: document.getElementById("n_r1").checked }], false));
    if (document.getElementById("n_lineup").checked) {
      const fresh = (await api.getTeams()).find((t) => t.code.toUpperCase() === code);
      const ids = [...boards[round.id]].sort((a, b) => a.position - b.position).map((t) => t.team_id);
      if (fresh && !ids.includes(fresh.id)) await run(() => api.adminSetRoundTeams(pin, round.id, [...ids, fresh.id]));
    }
    toast(`Team ${code} added`); render();
  };
  pane.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => {
    const t = teams.find((x) => x.id === Number(b.dataset.edit));
    const row = pane.querySelector(`[data-row="${t.id}"]`);
    row.innerHTML = `<td><input type="text" value="${esc(t.code)}" data-f="code" style="width:70px"></td>
      <td><input type="text" value="${esc(t.project)}" data-f="project"></td>
      <td><input type="text" value="${esc(t.members)}" data-f="members" title="Separate members with ;"></td>
      <td><input type="text" value="${esc(t.department)}" data-f="department"></td><td></td>
      <td style="white-space:nowrap"><button class="btn primary" data-save>Save</button> <button class="btn" data-cancel>Cancel</button></td>`;
    row.querySelector("[data-f=members]").focus();
    row.querySelector("[data-cancel]").onclick = () => render();
    row.querySelector("[data-save]").onclick = async () => {
      const patch = Object.fromEntries([...row.querySelectorAll("[data-f]")].map((i) => [i.dataset.f, i.value.trim()]));
      patch.members = patch.members.split(/[;,]/).map((x) => x.trim()).filter(Boolean).join("; ");
      if (!patch.code || !patch.project) return toast("Team code and project name are required", "err");
      await run(() => api.adminUpdateTeam(pin, t.id, patch), `${patch.code} saved`); render();
    };
  });
  pane.querySelectorAll("[data-r1]").forEach((c) => c.onchange = () => run(() => api.adminUpdateTeam(pin, Number(c.dataset.r1), { round1: c.checked }), "Saved"));
  pane.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (!confirm("Delete this team and all its scores?")) return;
    await run(() => api.adminDeleteTeam(pin, Number(b.dataset.del)), "Team deleted"); render();
  });
}

// ----------------------------------------------------------------- rounds --
function roundsPane(pane, { teams, boards }) {
  const byId = Object.fromEntries(teams.map((t) => [t.id, t]));
  const r1 = rank(boards[1]).filter((r) => r.judges > 0), r2 = rank(boards[2]).filter((r) => r.judges > 0);
  const plans = {
    1: { label: "All Round-1 teams (IT Business 3rd year), by team code", ids: () => teams.filter((t) => t.round1).sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true })).map((t) => t.id) },
    2: { label: `Top ${rounds[0].qualify_top} of Round 1 + all teams that skip Round 1`, ids: () => {
      const q = r1.filter((r) => r.rank <= rounds[0].qualify_top).map((r) => r.team_id);
      const others = teams.filter((t) => !t.round1 && !q.includes(t.id)).map((t) => t.id);
      return [...q, ...others]; } },
    3: { label: `Top ${rounds[1].qualify_top} of Round 2`, ids: () => r2.filter((r) => r.rank <= rounds[1].qualify_top).map((r) => r.team_id) },
  };
  pane.innerHTML = `<div class="grid cols-3">${rounds.map((r) => {
    const lineup = [...boards[r.id]].sort((a, b) => a.position - b.position);
    const scored = lineup.filter((t) => t.judges).length;
    return `<section class="card stack"><h2>${esc(r.name)} <span class="badge">${lineup.length} teams</span></h2>
      <p class="muted small">${esc(r.description)}</p>${r.id > 1 ? `<p class="small" style="color:#86efac;margin:0">⚡ Filled automatically when ${esc(rounds[r.id - 2].name)} is fully scored.</p>` : ""}
      <button class="btn primary" data-build="${r.id}">Build line-up</button>
      <p class="muted small">${plans[r.id].label}${r.id > 1 && !(r.id === 2 ? r1 : r2).length ? " — previous round has no scores yet." : ""}</p>
      <button class="btn" data-shuffle="${r.id}" ${lineup.length < 2 ? "disabled" : ""}>🔀 Random presentation order</button>
      ${scored ? `<p class="small" style="color:#fca5a5">${scored} teams already have scores in this round. Rebuilding keeps their scores.</p>` : ""}
      <ol class="small" style="max-height:340px;overflow:auto;padding-left:22px">${lineup.map((t) => `<li><b>${esc(t.code)}</b> ${esc(byId[t.team_id]?.project || "")}</li>`).join("")}</ol>
    </section>`; }).join("")}</div>`;
  pane.querySelectorAll("[data-build]").forEach((b) => b.onclick = async () => {
    const id = Number(b.dataset.build), ids = plans[id].ids();
    if (!ids.length) return toast("No teams match. Check the Teams tab or the previous round's scores.", "err");
    if (boards[id].length && !confirm(`Replace the current ${rounds[id - 1].name} line-up with ${ids.length} teams?`)) return;
    await run(() => api.adminSetRoundTeams(pin, id, ids), `${rounds[id - 1].name}: ${ids.length} teams`); render();
  });
  pane.querySelectorAll("[data-shuffle]").forEach((b) => b.onclick = async () => {
    const id = Number(b.dataset.shuffle);
    const ids = boards[id].map((t) => t.team_id);
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    await run(() => api.adminSetRoundTeams(pin, id, ids), "Order shuffled"); render();
  });
}

// ----------------------------------------------------------------- judges --
function judgesPane(pane, { judges }) {
  pane.innerHTML = `<div class="grid cols-2">
    <section class="card"><h2>Judges</h2>
      <table><thead><tr><th>Name</th><th class="num">Scores given</th><th>Status</th><th></th></tr></thead><tbody>
      ${judges.map((j) => `<tr><td><b>${esc(j.name)}</b></td><td class="num">${j.scores}</td>
        <td>${j.active ? `<span class="badge ok">ACTIVE</span>` : `<span class="badge off">REMOVED</span>`}</td>
        <td style="white-space:nowrap"><button class="btn" data-ren="${j.id}" data-name="${esc(j.name)}">✎ Rename</button>
          <button class="btn" data-pin="${j.id}" data-name="${esc(j.name)}">🔑 New PIN</button>
          <button class="btn ${j.active ? "danger" : ""}" data-j="${j.id}" data-a="${j.active ? 0 : 1}">${j.active ? "Remove" : "Restore"}</button></td></tr>`).join("")}
      </tbody></table>
      <p class="muted small">Removing a judge keeps their submitted scores but hides them from the live screen and stops further scoring.</p></section>
    <section class="card stack"><h2>➕ Add an extra judge</h2>
      <p class="muted small">New judges can join at any time, even in the middle of a round. Their scores count for the teams they score; a team's result is the average of the judges who scored it.</p>
      <label class="field"><span>Name shown on the live screen</span><input type="text" id="jn" placeholder="e.g. Dr. Karimov"></label>
      <label class="field"><span>Personal PIN (min. 4 digits, give it to the judge privately)</span><input type="text" id="jp" inputmode="numeric"></label>
      <button class="btn primary" id="jadd">Add judge</button>
      <button class="btn" id="jgen">Generate random PIN</button>
      ${api.mode !== "demo" ? `<hr style="border-color:var(--line);width:100%"><h2>Organizer PIN</h2>
      <label class="field"><span>New organizer PIN</span><input type="password" id="np"></label><button class="btn" id="npb">Change PIN</button>` : ""}
    </section></div>`;
  pane.querySelectorAll("[data-j]").forEach((b) => b.onclick = async () => { await run(() => api.adminSetJudgeActive(pin, Number(b.dataset.j), b.dataset.a === "1"), "Saved"); render(); });
  pane.querySelectorAll("[data-ren]").forEach((b) => b.onclick = async () => {
    const name = prompt("New name shown on the live screen:", b.dataset.name);
    if (!name || !name.trim()) return;
    await run(() => api.adminUpdateJudge(pin, Number(b.dataset.ren), name.trim(), ""), "Judge renamed"); render();
  });
  pane.querySelectorAll("[data-pin]").forEach((b) => b.onclick = async () => {
    const suggestion = String(Math.floor(100000 + Math.random() * 900000));
    const p = prompt(`New PIN for ${b.dataset.name} (min. 4 digits). Write it down and give it to the judge:`, suggestion);
    if (!p) return;
    await run(() => api.adminUpdateJudge(pin, Number(b.dataset.pin), "", p.trim()), `New PIN saved for ${b.dataset.name}: ${p.trim()}`); render();
  });
  document.getElementById("jgen").onclick = () => { document.getElementById("jp").value = String(Math.floor(100000 + Math.random() * 900000)); };
  document.getElementById("jadd").onclick = async () => {
    const n = document.getElementById("jn").value.trim(), p = document.getElementById("jp").value.trim();
    if (!n || p.length < 4) return toast("Enter a name and a PIN of at least 4 digits", "err");
    await run(() => api.adminAddJudge(pin, n, p), `Judge added — PIN ${p}`); render();
  };
  const npb = document.getElementById("npb");
  if (npb) npb.onclick = async () => {
    const p = document.getElementById("np").value.trim();
    await run(() => api.adminChangePin(pin, p), "Organizer PIN changed");
    pin = p; sessionStorage.setItem("adminPin", p);
  };
}

// ---------------------------------------------------------------- results --
async function results(pane, { st, boards }) {
  const rid = resultsRound ?? st.active_round;
  const round = rounds.find((r) => r.id === rid);
  const ranked = rank(boards[rid]);
  const detail = await api.adminScores(pin, rid);
  const judgeNames = [...new Set(detail.map((d) => d.judge_name))];
  const per = {};
  for (const d of detail) (per[d.team_id] ??= {})[d.judge_name] = d;
  const critAvg = (teamId, cid) => { const ds = Object.values(per[teamId] || {}); return ds.length ? ds.reduce((a, d) => a + Number(d.criteria[cid]), 0) / ds.length : null; };
  const award = (r) => {
    if (!r.rank) return "";
    if (rid === 1) return r.rank === 1 ? "1st · 600,000 UZS + certificate" : r.rank === 2 ? "2nd · 300,000 UZS + certificate" : r.rank === 3 ? "3rd · certificate" : r.rank <= round.qualify_top ? "Qualified for Round 2" : "";
    if (rid === 2) return (r.rank <= 10 ? "Certificate" : "") + (r.rank <= round.qualify_top ? " · Qualified for Final" : "");
    return r.rank === 1 ? "1st · cash prize + certificate + gift" : r.rank <= 3 ? `${r.rank === 2 ? "2nd" : "3rd"} · certificate + gift` : "";
  };

  pane.innerHTML = `<section class="card">
    <div class="row noprint" style="margin-bottom:12px">
      <div class="seg">${rounds.map((r) => `<button data-rr="${r.id}" class="${r.id === rid ? "on" : ""}">${esc(r.name)}</button>`).join("")}</div>
      <span style="flex:1"></span>
      <button class="btn" id="csv1">⬇ Ranking CSV</button><button class="btn" id="csv2">⬇ All judge scores CSV</button>
      <button class="btn" id="json">⬇ Full backup (JSON)</button><button class="btn" id="print">🖨 Print</button>
    </div>
    <h2>${esc(round.name)} — results <span class="muted small">${new Date().toLocaleString()}</span></h2>
    <div style="overflow:auto"><table><thead><tr><th>Rank</th><th>Team</th><th>Project / members</th>
      ${criteria.map((c) => `<th class="num" title="${esc(c.name)}">C${c.id}</th>`).join("")}
      ${judgeNames.map((n) => `<th class="num">${esc(n)}</th>`).join("")}<th class="num">Score /100</th><th>Award</th></tr></thead><tbody>
    ${ranked.map((r) => `<tr class="${r.rank === round.qualify_top ? "cut" : ""}"><td><b>${r.rank ?? "–"}</b></td><td><b>${esc(r.code)}</b></td>
      <td>${esc(r.project)}<div class="muted small">${esc(r.members)}</div></td>
      ${criteria.map((c) => { const v = critAvg(r.team_id, c.id); return `<td class="num">${v === null ? "–" : fmt(v)}</td>`; }).join("")}
      ${judgeNames.map((n) => `<td class="num">${per[r.team_id]?.[n] ? fmt(per[r.team_id][n].total) : "–"}</td>`).join("")}
      <td class="num"><b>${r.judges ? fmt(r.score) : "–"}</b></td><td class="small">${award(r)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted small">${criteria.map((c) => `C${c.id} = ${esc(c.name)}`).join(" · ")} · Judge columns = total out of ${maxTotal}.</p>
  </section>
  <section class="card noprint" style="margin-top:18px"><h2>Danger zone</h2>
    <p class="muted small">Deletes every judge score in ${esc(round.name)}. Download a backup first.</p>
    <button class="btn danger" id="reset">Delete all ${esc(round.name)} scores</button></section>`;

  pane.querySelectorAll("[data-rr]").forEach((b) => b.onclick = () => { resultsRound = Number(b.dataset.rr); render(); });
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
  document.getElementById("csv1").onclick = () => download(`ranking-${round.name.replace(/\s/g, "")}-${stamp}.csv`, toCsv([
    ["rank", "code", "project", "members", "department", ...criteria.map((c) => c.name), "score_out_of_100", "judges", "award"],
    ...ranked.map((r) => [r.rank ?? "", r.code, r.project, r.members, r.department, ...criteria.map((c) => { const v = critAvg(r.team_id, c.id); return v === null ? "" : v.toFixed(2); }), r.judges ? r.score : "", r.judges, award(r)])]));
  document.getElementById("csv2").onclick = () => download(`judge-scores-${round.name.replace(/\s/g, "")}-${stamp}.csv`, toCsv([
    ["round", "code", "project", "judge", ...criteria.map((c) => c.name), "total", "comment", "updated_at"],
    ...detail.map((d) => [round.name, d.code, d.project, d.judge_name, ...criteria.map((c) => d.criteria[c.id]), d.total, d.comment, d.updated_at])]));
  document.getElementById("json").onclick = async () => {
    const all = { exported_at: new Date().toISOString(), rounds, criteria, teams: await api.getTeams(), state: await api.getState(), lineups: {}, scores: {} };
    for (const r of rounds) { all.lineups[r.id] = await api.getLeaderboard(r.id); all.scores[r.id] = await api.adminScores(pin, r.id); }
    download(`technovate-backup-${stamp}.json`, JSON.stringify(all, null, 2), "application/json");
  };
  document.getElementById("print").onclick = () => window.print();
  document.getElementById("reset").onclick = async () => {
    if (prompt(`Type DELETE to remove all ${round.name} scores`) !== "DELETE") return;
    await run(() => api.adminResetRound(pin, rid), "Scores deleted"); render();
  };
}

// ------------------------------------------------------------------ start --
let busy = false, again = false;
async function safeRender() {
  if (busy) { again = true; return; }
  busy = true;
  try { await render(); } catch (e) { toast(e.message, "err"); if (/PIN/.test(e.message)) { sessionStorage.removeItem("adminPin"); loginView(e.message); } }
  busy = false; if (again) { again = false; safeRender(); }
}
async function start() {
  const lo = document.getElementById("logout");
  lo.classList.remove("hidden");
  lo.onclick = () => { sessionStorage.removeItem("adminPin"); location.reload(); };
  // live refresh only on the control tab, and never while typing
  api.subscribe(() => { if (["control", "dashboard", "presentations"].includes(tab) && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) safeRender(); });
  safeRender();
}
pin && (await api.adminCheck(pin).catch(() => false)) ? start() : loginView();
</script>
</body>
</html>
